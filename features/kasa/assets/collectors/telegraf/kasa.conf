# Autonomously managed configuration for Kasa Hardware Telemetry & Host Sensors
[[inputs.temp]]

[[inputs.sensors]]
  # Utilizes lm-sensors to read from hwmon (essential for AMD Ryzen CPUs)

[[inputs.exec]]
  commands = ["/tmp/venv/bin/python /metaclaw/features/kasa/bin/power_kasa.py"]
  timeout = "10s"
  interval = "15s"
  data_format = "influx"

[[inputs.exec]]
  commands = ["/tmp/venv/bin/python /metaclaw/features/kasa/bin/gpu_telemetry.py"]
  timeout = "10s"
  interval = "15s"
  data_format = "influx"

