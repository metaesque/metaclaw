# Autonomously managed configuration for Kasa Hardware Telemetry & Host Sensors
[[inputs.temp]]

[[inputs.sensors]]
  # Utilizes lm-sensors to read from hwmon (essential for AMD Ryzen CPUs)

[[inputs.exec]]
  commands = ["/opt/venv/bin/python /metaclaw/features/kasa/bin/power_kasa.py"]
  timeout = "10s"
  interval = "20s"
  data_format = "influx"

[[inputs.exec]]
  commands = ["/opt/venv/bin/python /metaclaw/features/kasa/bin/gpu_telemetry.py"]
  timeout = "10s"
  interval = "15s"
  data_format = "influx"

[[inputs.exec]]
  commands = ["/opt/venv/bin/python /metaclaw/features/kasa/bin/disk_telemetry.py"]
  timeout = "10s"
  interval = "60s"
  data_format = "influx"

[[inputs.diskio]]
  # Natively scrapes the host kernel for throughput, IOPS, and I/O wait times
  # across all attached block devices.

[[inputs.smart]]
  # Natively executes smartctl to acquire Drive Wear % and Health OK metrics.
  # Requires smartmontools and nvme-cli installed in the container, and /dev mounted.
  attributes = true
