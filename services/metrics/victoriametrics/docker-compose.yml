services:
  victoriametrics:
    # WHAT THIS IS: A high-performance time-series database (TSDB) and metrics scraper.
    # WHY THIS TOOL: It acts as a drop-in replacement for Prometheus but uses vastly less RAM.
    image: victoriametrics/victoria-metrics:${VICTORIAMETRICS_VERSION}
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "${VICTORIAMETRICS_PORT}:8428"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${VICTORIAMETRICS_RETENTION}"
      # Add -promscrape.config=/etc/prometheus/prometheus.yml here in the future
      # to enable native pull-scraping of edge node exporters.
    volumes:
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/victoriametrics-data:/victoria-metrics-data
    networks:
      shared-network:
        aliases:
          - active-metrics

networks:
  shared-network:
    name: ${NETWORK_NAME:-openclaw-network}
    external: true
