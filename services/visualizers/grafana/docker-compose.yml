services:
  grafana:
    # WHAT THIS IS: A powerful UI for visualizing time-series metrics and logs.
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Prevent Grafana from phoning home telemetry data
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/grafana-data:/var/lib/grafana
    networks:
      shared-network:
        aliases:
          - active-visualizer

networks:
  shared-network:
    name: ${NETWORK_NAME:-openclaw-network}
    external: true
