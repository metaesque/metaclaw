services:
  grafana-init-visualizer:
    # WHAT THIS IS: A short-lived initialization container.
    # WHY IT EXISTS: Docker Compose creates host-mounted volumes as root by default.
    # This container preemptively chowns the directory to uid 472 (Grafana's internal user)
    # to prevent Permission Denied crash-loops, working uniformly across all host OS platforms.
    image: alpine:3.19
    container_name: grafana-init-visualizer
    command: >
      /bin/sh -c "mkdir -p /var/lib/grafana && chown -R 472:0 /var/lib/grafana"
    volumes:
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/grafana-data:/var/lib/grafana
    networks:
      - shared-network

  grafana-visualizer:
    # WHAT THIS IS: A powerful UI for visualizing time-series metrics and logs.
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana-visualizer
    restart: unless-stopped
    depends_on:
      grafana-init-visualizer:
        # WHAT THIS DOES: Forces Docker Compose to wait until the init container
        # finishes fixing the permissions before attempting to boot Grafana.
        condition: service_completed_successfully
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Prevent Grafana from phoning home telemetry data
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/grafana-data:/var/lib/grafana
      - ${METACLAW_ROOT:-/home/node/repo}/features/kasa/assets/visualizers/grafana:/etc/grafana/provisioning/kasa:ro
      - ${METACLAW_CONFIG:-/home/node/config}/data/grafana/provisioning/custom:/etc/grafana/provisioning/custom:ro
    networks:
      shared-network:
        aliases:
          - active-visualizer

networks:
  shared-network:
    name: ${NETWORK_NAME:-openclaw-network}
    external: true
