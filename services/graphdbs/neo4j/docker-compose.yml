services:
  neo4j-graphdb:
    image: neo4j:${NEO4J_VERSION}
    container_name: neo4j-graphdb
    restart: unless-stopped
    ports:
      - "${NEO4J_PORT_HTTP}:7474"
      - "${NEO4J_PORT_BOLT}:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/neo4j-data:/data
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/neo4j-logs:/logs
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/neo4j-import:/var/lib/neo4j/import
      - ${EXTERNAL_DRIVE_PATH:-/tmp}/neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      shared-network:
        aliases:
          - active-graphdb

networks:
  shared-network:
    name: ${NETWORK_NAME:-openclaw-network}
    external: true
