services:
  kokoro-speech-runner:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:${KOKORO_VERSION:-latest}
    container_name: kokoro-speech-runner
    restart: unless-stopped
    ports:
      - "${KOKORO_PORT}:8880"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8880/docs', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      shared-network:
        aliases:
          - active-speech-runner

networks:
  shared-network:
    name: ${NETWORK_NAME:-openclaw-network}
    external: true
