# ==============================================================================
# TELEGRAF METRICS COLLECTOR CONFIGURATION
# ==============================================================================

[global_tags]
  host = "${HOST_IDENTIFIER}"

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  debug = false
  quiet = false
  omit_hostname = false

# ------------------------------------------------------------------------------
# OUTPUTS
# ------------------------------------------------------------------------------
# Push directly to VictoriaMetrics using Influx Line Protocol
[[outputs.influxdb]]
  urls = ["http://${ACTIVE_TSDB_HOST}:8428"]
  database = "victoriametrics"
  skip_database_creation = true
  exclude_retention_policy_tag = true
  content_encoding = "gzip"

# ------------------------------------------------------------------------------
# INPUTS (Host Telemetry)
# ------------------------------------------------------------------------------
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.mem]]

# ------------------------------------------------------------------------------
# INPUTS (Custom Script Execution)
# ------------------------------------------------------------------------------
[[inputs.exec]]
  # WHAT THIS DOES: Executes the Kasa telemetry script using the container's isolated Python environment.
  commands = ["/tmp/venv/bin/python /workspace/src/projects/kasa/bin/power_kasa.py"]
  timeout = "10s"
  # Expect Influx Line Protocol natively (e.g. kasa_power,device=compute watts=120)
  data_format = "influx"
