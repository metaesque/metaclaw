services:
  telegraf-collector:
    # ARCHITECTURAL SHIFT: We now build a custom image locally to cache the Python
    # virtual environment and `lm-sensors` installation, resolving the 45+ second
    # cold-boot delay during container recreation.
    build:
      context: .
      args:
        TELEGRAF_VERSION: ${TELEGRAF_VERSION}
    image: metaclaw-telegraf:${TELEGRAF_VERSION}
    # WHAT THIS DOES: Forces Docker to build from source or use the local cache,
    # suppressing "pull access denied" warnings from Docker Hub.
    pull_policy: build
    container_name: telegraf-collector
    restart: unless-stopped
    user: root
    # WHAT THIS DOES: Bypasses the default Telegraf entrypoint.sh script which
    # forcibly drops root privileges down to the 'telegraf' user (UID 999).
    # We MUST run as true root to execute the chroot syscall for GPU metrics.
    entrypoint: ["telegraf"]
    network_mode: "host"
    # WHAT THIS DOES: Bypasses strict Linux CGroup device restrictions.
    # WHY IT MATTERS: Allows the container's chroot environment to successfully open
    # character devices like /dev/nvidiactl for telemetry polling without requiring
    # architecture-specific --device flags that would break AMD/macOS nodes.
    privileged: true
    environment:
      - ACTIVE_TSDB_HOST=${ACTIVE_TSDB_HOST:-127.0.0.1}
      - HOST_IDENTIFIER=${ACTIVE_COLLECTOR_HOST:-unknown}
      # WHAT THIS DOES: Informs Telegraf's native plugins to look at the mounted host filesystem
      # instead of the container's isolated filesystem for system metrics.
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_ETC=/hostfs/etc
      - HOST_MOUNT_PREFIX=/hostfs
      - METACLAW_CONFIG=/config
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Expose host hardware telemetry to the container
      - /:/hostfs:ro
      - ${METACLAW_ROOT:-/home/node/repo}:/metaclaw:ro
      - ${METACLAW_CONFIG:-/home/node/config}:/config:ro
      - ${METACLAW_ROOT:-/home/node/repo}/features/kasa/assets/collectors/telegraf:/etc/telegraf/telegraf.d:ro
