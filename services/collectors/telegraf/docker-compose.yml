services:
  telegraf:
    image: telegraf:${TELEGRAF_VERSION}
    container_name: telegraf
    # WHAT THIS DOES: Elevates the container user to root.
    # WHY IT MATTERS: Required to bypass "Permission denied" errors when running 'apk add' to provision the Python environment inside the Alpine image on boot.
    user: root
    restart: unless-stopped
    environment:
      - ACTIVE_TSDB_HOST=${ACTIVE_TSDB_HOST:-active-tsdb}
      - HOST_IDENTIFIER=${ACTIVE_COLLECTOR_HOST:-unknown}
    # WHAT THIS DOES: Installs Python, provisions a venv, and launches Telegraf with a dynamic config directory flag.
    command: /bin/sh -c "apk add --no-cache python3 py3-pip && python3 -m venv /tmp/venv && /tmp/venv/bin/pip install python-kasa pyyaml && exec telegraf --config /etc/telegraf/telegraf.conf --config-directory /etc/telegraf/telegraf.d"
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      - ${OPENCLAW_WORKSPACE:-/tmp}:/workspace:ro
      # WHAT THIS DOES: Mounts the agent-managed drop-folder into the container.
      # WHY IT MATTERS: Agents can dynamically add project-specific Telegraf configurations here without editing the MetaClaw framework files.
      - ${OPENCLAW_WORKSPACE:-/tmp}/.telegraf.d:/etc/telegraf/telegraf.d:ro
    networks:
      shared-network:
        aliases:
          - active-collector

networks:
  shared-network:
    name: ${NETWORK_NAME:-openclaw-network}
    external: true
