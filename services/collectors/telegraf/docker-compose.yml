services:
  telegraf-collector:
    image: telegraf:${TELEGRAF_VERSION}
    container_name: telegraf-collector
    restart: unless-stopped
    user: root
    network_mode: "host"
    environment:
      - ACTIVE_TSDB_HOST=${ACTIVE_TSDB_HOST:-127.0.0.1}
      - HOST_IDENTIFIER=${ACTIVE_COLLECTOR_HOST:-unknown}
      # WHAT THIS DOES: Informs Telegraf's native plugins to look at the mounted host filesystem
      # instead of the container's isolated filesystem for system metrics.
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_ETC=/hostfs/etc
      - HOST_MOUNT_PREFIX=/hostfs
      # WHAT THIS DOES: Hardcodes the internal mount point for scripts running inside the container.
      - METACLAW_CONFIG=/config
    entrypoint:
      - /bin/sh
      - -c
      - |
        apt-get update && apt-get install -y python3 python3-pip python3-venv gcc python3-dev lm-sensors
        python3 -m venv /tmp/venv
        /tmp/venv/bin/pip install python-kasa pyyaml
        chown -R telegraf:telegraf /tmp/venv
        exec /entrypoint.sh telegraf --config /etc/telegraf/telegraf.conf --config-directory /etc/telegraf/telegraf.d
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Expose host hardware telemetry to the container
      - /:/hostfs:ro
      - ${METACLAW_ROOT:-/home/node/repo}:/metaclaw:ro
      - ${METACLAW_CONFIG:-/home/node/config}:/config:ro
      - ${METACLAW_ROOT:-/home/node/repo}/features/kasa/assets/collectors/telegraf:/etc/telegraf/telegraf.d:ro

