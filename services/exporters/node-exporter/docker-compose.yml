services:
  node-exporter:
    # WHAT THIS IS: A hardware telemetry scraper that exposes Linux kernel metrics.
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      # WHAT THIS DOES: Mounts read-only host system directories so the exporter
      # can scrape physical hardware states instead of virtualized Docker boundaries.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      shared-network:
        aliases:
          - active-exporter

networks:
  shared-network:
    name: ${NETWORK_NAME:-openclaw-network}
    external: true
